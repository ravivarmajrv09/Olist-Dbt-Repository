version: 2

models:

  # =====================================================
  # PL ORDER ANALYTICS
  # =====================================================

  - name: pl_order_analytics

    description: >
      Presentation-layer order analytics for reporting.

    columns:

      - name: order_hk
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null
          - unique

      - name: business_order_status
        tests:
          - not_null
          - accepted_values:
              values:
                - COMPLETED
                - CANCELLED
                - IN_PROGRESS
                - OTHER

      - name: delivery_performance
        tests:
          - not_null
          - accepted_values:
              values:
                - ON_TIME
                - LATE
                - NOT_DELIVERED

      - name: item_count
        tests:
          - not_null

      - name: total_product_value
        tests:
          - not_null

      - name: total_freight_value
        tests:
          - not_null

      - name: total_order_value
        tests:
          - not_null

      - name: freight_percentage
        tests:
          - not_null

      - name: load_date
        tests:
          - not_null

      - name: pl_load_date
        tests:
          - not_null


  # =====================================================
  # PL CUSTOMER ANALYTICS
  # =====================================================

  - name: pl_customer_analytics

    description: >
      Presentation-layer customer analytics.

    columns:

      - name: customer_hk
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - unique

      - name: total_orders
        tests:
          - not_null

      - name: total_product_spend
        tests:
          - not_null

      - name: total_freight_spend
        tests:
          - not_null

      - name: total_spend
        tests:
          - not_null

      - name: average_order_value
        tests:
          - not_null

      - name: last_order_date
        tests:
          - not_null

      - name: load_date
        tests:
          - not_null

      - name: pl_load_date
        tests:
          - not_null


  # =====================================================
  # PL PRODUCT ANALYTICS
  # =====================================================

  - name: pl_product_analytics

    description: >
      Presentation-layer product sales analytics.

    columns:

      - name: product_hk
        tests:
          - not_null
          - unique

      - name: product_id
        tests:
          - not_null
          - unique

      - name: total_items_sold
        tests:
          - not_null

      - name: total_product_revenue
        tests:
          - not_null

      - name: total_freight_value
        tests:
          - not_null

      - name: total_revenue
        tests:
          - not_null

      - name: average_item_price
        tests:
          - not_null

      - name: load_date
        tests:
          - not_null

      - name: pl_load_date
        tests:
          - not_null


  # =====================================================
  # PL SELLER ANALYTICS
  # =====================================================

  - name: pl_seller_analytics

    description: >
      Presentation-layer seller sales analytics.

    columns:

      - name: seller_hk
        tests:
          - not_null
          - unique

      - name: seller_id
        tests:
          - not_null
          - unique

      - name: total_items_sold
        tests:
          - not_null

      - name: total_product_revenue
        tests:
          - not_null

      - name: total_freight_value
        tests:
          - not_null

      - name: total_revenue
        tests:
          - not_null

      - name: average_item_price
        tests:
          - not_null

      - name: load_date
        tests:
          - not_null

      - name: pl_load_date
        tests:
          - not_null