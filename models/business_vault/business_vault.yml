version: 2

models:

  # =====================================================
  # BV_ORDER_STATUS
  # =====================================================

  - name: bv_order_status

    description: >
      Business Vault order status and delivery performance.

    columns:

      - name: order_hk
        tests:
          - not_null

      - name: order_id
        tests:
          - not_null

      - name: order_status
        tests:
          - not_null

      - name: business_order_status
        tests:
          - not_null
          - accepted_values:
              values:
                - COMPLETED
                - CANCELLED
                - IN_PROGRESS
                - OTHER

      - name: delivery_performance
        tests:
          - not_null
          - accepted_values:
              values:
                - ON_TIME
                - LATE
                - NOT_DELIVERED

      - name: load_date
        tests:
          - not_null

      - name: record_source
        tests:
          - not_null


  # =====================================================
  # BV_ORDER_METRICS
  # =====================================================

  - name: bv_order_metrics

    description: >
      Business-level metrics calculated for each order.

    columns:

      - name: order_hk
        tests:
          - not_null
          - unique

      - name: item_count
        tests:
          - not_null

      - name: total_product_value
        tests:
          - not_null

      - name: total_freight_value
        tests:
          - not_null

      - name: total_order_value
        tests:
          - not_null

      - name: load_date
        tests:
          - not_null

      - name: record_source
        tests:
          - not_null


  # =====================================================
  # BV_CUSTOMER_METRICS
  # =====================================================

  - name: bv_customer_metrics

    description: >
      Business-level metrics calculated for each customer.

    columns:

      - name: customer_hk
        tests:
          - not_null
          - unique

      - name: total_orders
        tests:
          - not_null

      - name: total_product_spend
        tests:
          - not_null

      - name: total_freight_spend
        tests:
          - not_null

      - name: total_spend
        tests:
          - not_null

      - name: last_order_date
        tests:
          - not_null

      - name: load_date
        tests:
          - not_null

      - name: record_source
        tests:
          - not_null


  # =====================================================
  # BV_PRODUCT_METRICS
  # =====================================================

  - name: bv_product_metrics

    description: >
      Business-level sales metrics calculated for each product.

    columns:

      - name: product_hk
        tests:
          - not_null
          - unique

      - name: total_items_sold
        tests:
          - not_null

      - name: total_product_revenue
        tests:
          - not_null

      - name: total_freight_value
        tests:
          - not_null

      - name: total_revenue
        tests:
          - not_null

      - name: load_date
        tests:
          - not_null

      - name: record_source
        tests:
          - not_null


  # =====================================================
  # BV_SELLER_METRICS
  # =====================================================

  - name: bv_seller_metrics

    description: >
      Business-level sales metrics calculated for each seller.

    columns:

      - name: seller_hk
        tests:
          - not_null
          - unique

      - name: total_items_sold
        tests:
          - not_null

      - name: total_product_revenue
        tests:
          - not_null

      - name: total_freight_value
        tests:
          - not_null

      - name: total_revenue
        tests:
          - not_null

      - name: load_date
        tests:
          - not_null

      - name: record_source
        tests:
          - not_null