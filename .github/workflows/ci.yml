name: DBT CI

on:
  pull_request:
    branches:
      - prod

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      - name: Install dbt dependencies
        run: dbt deps

      - name: Check dbt project
        run: dbt parse